<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'none';img-src data:;style-src 'unsafe-inline';base-uri 'none';form-action 'none'"><meta name="color-scheme" content="light"><title>ZURICH AUTOMATIVE</title><style>*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg)}a{text-decoration:none;color:inherit}
.bioPage{position:relative;isolation:isolate;overflow:hidden;min-height:100svh;width:100%;background:var(--bg);padding:clamp(20px,4vw,36px) max(16px,env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.bioBg{position:absolute;inset:0;z-index:0;background-size:cover;background-repeat:no-repeat;background-position:var(--bg-pos,center)}
.bioOverlay{position:absolute;inset:0;z-index:1;background:var(--overlay,rgba(0,0,0,0));pointer-events:none}
.inner{position:relative;z-index:2;width:min(480px,100%);margin:0 auto}
.profile{text-align:center;padding:8px 6px 4px}
.logo{width:clamp(88px,24vw,104px);height:clamp(88px,24vw,104px);border-radius:50%;object-fit:cover;background:#fff;border:5px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(0,0,0,.14);display:inline-block}
.logoFallback{display:grid;place-items:center;margin:auto;font-size:34px;font-weight:950;color:var(--brand);width:clamp(88px,24vw,104px);height:clamp(88px,24vw,104px)}
.name{font-size:clamp(25px,7vw,29px);line-height:1.08;font-weight:900;letter-spacing:-.04em;margin:14px 0 8px;color:var(--name-color,#18181b)}
.desc{font-size:14px;line-height:1.6;color:var(--desc-color,#52525b);max-width:400px;margin:0 auto;overflow-wrap:anywhere}
.bioActions{display:grid;gap:10px;margin-top:22px}
.bioAction{min-height:54px;border-radius:var(--radius,16px);padding:13px 16px;display:grid;grid-template-columns:26px 1fr 20px;align-items:center;gap:10px;font-weight:800;overflow-wrap:anywhere;color:var(--button-text,#18181b);border:var(--btn-border,1px solid rgba(0,0,0,.08));box-shadow:var(--btn-shadow,0 8px 20px rgba(0,0,0,.06));transition:transform .18s ease,box-shadow .18s ease}
.bioAction:hover{transform:translateY(-2px)}
.bioAction:active{transform:scale(.98)}
.bioAction:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.ico{width:21px;height:21px;display:block}
.chev{font-size:19px;opacity:.5;justify-self:end}
.footer{text-align:center;color:var(--secondary-text,#8a8a92);font-size:12px;font-weight:800;margin-top:24px}
@media(prefers-reduced-motion:reduce){.bioAction{transition:none}.bioAction:hover{transform:none}}

.theme-solid .bioAction{background:#ffffff}
.theme-solid .bioAction.primary{background:var(--brand);color:#fff;border-color:transparent}

.theme-liquid .bioPage{background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 16%,var(--bg)) 0%,var(--bg) 45%,var(--bg) 100%)}
.theme-liquid .bioAction{background:rgba(255,255,255,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-color:rgba(255,255,255,.5)}
.theme-liquid .bioAction.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 70%,#fff),var(--brand));color:#fff;border-color:rgba(255,255,255,.6)}
@supports not (backdrop-filter:blur(1px)){.theme-liquid .bioAction{background:rgba(255,255,255,.86)}}

.theme-minimal .bioAction{background:transparent;box-shadow:none}
.theme-minimal .bioAction.primary{background:var(--brand);color:#fff;border-color:var(--brand)}

.theme-dark .bioPage{background:#101014}
.theme-dark .bioAction{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12);box-shadow:none}
.theme-dark .bioAction.primary{background:var(--brand);color:#fff;border-color:transparent}
.theme-dark .footer{opacity:.8}

.theme-imagefocus .bioPage{background:#18181c}
.theme-imagefocus .bioAction{background:rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:rgba(255,255,255,.45);box-shadow:0 10px 26px rgba(0,0,0,.28)}
.theme-imagefocus .bioAction.primary{background:var(--brand);color:#fff;border-color:transparent}
@supports not (backdrop-filter:blur(1px)){.theme-imagefocus .bioAction{background:rgba(20,20,24,.55)}}

@media(max-width:420px){.bioAction{min-height:52px;padding:12px 13px}}
